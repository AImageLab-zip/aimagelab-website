<VirtualHost *:80>
    ServerName aimagelab.unimore.it
    ServerAlias aimagelab-app.ing.unimore.it aimagelab.ing.unimore.it
    ServerAlias imagelab.ing.unimore.it imagelab.unimore.it www.imagelab.unimore.it www.imagelab.ing.unimore.it
    ServerAlias imagelab.ing.unimo.it www.imagelab.unimo.it www.imagelab.ing.unimo.it imagelab.unimo.it
    ServerAlias www.aimagelab.unimo.it www.aimagelab.ing.unimo.it aimagelab.unimo.it aimagelab.ing.unimo.it
    DocumentRoot /var/www/html

    # Let's Encrypt ACME challenge - serve directly from Apache
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Require all granted
        AllowOverride None
        Options None
    </Directory>

    # Redirect HTTP to HTTPS canonical domain (except for ACME challenge)
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://aimagelab.unimore.it%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/aimagelab_error.log
    CustomLog ${APACHE_LOG_DIR}/aimagelab_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName aimagelab.unimore.it
    ServerAlias aimagelab-app.ing.unimore.it aimagelab.ing.unimore.it
    ServerAlias imagelab.ing.unimore.it imagelab.unimore.it www.imagelab.unimore.it www.imagelab.ing.unimore.it
    ServerAlias imagelab.ing.unimo.it www.imagelab.unimo.it www.imagelab.ing.unimo.it imagelab.unimo.it
    ServerAlias www.aimagelab.unimo.it www.aimagelab.ing.unimo.it aimagelab.unimo.it aimagelab.ing.unimo.it
    ServerAdmin admin@unimore.it
    DocumentRoot /var/www/html
    
    # Redirect /imagelab to legacy server
    RewriteEngine On
    RewriteRule ^/imagelab/(.*)$ https://aimagelab-legacy.ing.unimore.it/imagelab/$1 [R=301,L]

        # Redirect /imagelab to legacy server
    RewriteEngine On
    RewriteRule ^/files/(.*)$ https://aimagelab-legacy.ing.unimore.it/files/$1 [R=302,L]
    
    # Redirect all aliases to canonical domain
    RewriteCond %{HTTP_HOST} !^aimagelab\.unimore\.it$ [NC]
    RewriteRule ^(.*)$ https://aimagelab.unimore.it$1 [R=301,L]

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/aimagelab-app.ing.unimore.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/aimagelab-app.ing.unimore.it/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy same-origin
    Header always set Cross-Origin-Opener-Policy same-origin

    # HSTS: browsers refuse plain HTTP for this host once they have seen it.
    # max-age is one year. It was deliberately held at 1 day until the
    # self-reloading renewal path (watch_certificate in
    # docker-entrypoint-apache-prod.sh) had been proven, because with HSTS an
    # expired certificate cannot be clicked through.
    # Proven 2026-10-18 by a forced renewal: certbot issued a new cert, the
    # watcher detected the swap on its next hourly poll and ran
    # `apache2ctl graceful`, and Apache served the new cert - no Docker socket
    # involved. That test also found and removed a stale `renew_hook` in
    # /etc/letsencrypt/renewal/<domain>.conf which still tried
    # `docker exec ... apache2ctl graceful` and failed with exit 127.
    # includeSubDomains is intentionally NOT set: it would bind every
    # *.aimagelab.unimore.it name, and whether any of those are served over
    # plain HTTP has not been verified. Add it once that is checked.
    Header always set Strict-Transport-Security "max-age=31536000"

    # CSP. script-src must keep 'unsafe-inline': the templates still carry 15
    # inline <script> blocks and 33 on*= handlers, so a nonce policy needs
    # those moved first. That means this does NOT stop injected inline script
    # on its own - the real defences for that are the sandboxed iframe in the
    # mailinglist moderation view and json_script in the calendar.
    # What it does buy, even with 'unsafe-inline':
    #   default-src 'self'      - nothing loads from an origin not listed here
    #   script-src <allowlist>  - injected <script src=evil> is blocked
    #   connect-src 'self'      - stolen data cannot be POSTed off-site; every
    #                             fetch/XHR in the templates is same-origin
    #   frame-ancestors 'none'  - no framing (clickjacking), beyond X-Frame-Options
    #   frame-src 'self'        - covers the moderation srcdoc iframe
    #   object-src 'none'       - no plugin content
    #   base-uri 'self'         - an injected <base> cannot re-point relative URLs
    #   form-action 'self'      - an injected form cannot post data off-site
    # The allowlisted hosts are exactly those referenced by <script src>,
    # <link rel=stylesheet> and ES-module imports in the templates.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://rsms.me; font-src 'self' data: https://rsms.me https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

    <Location /Shibboleth.sso>
        AuthType None
        Require all granted
        SetHandler shib
    </Location>

    Alias /shibboleth-sp /usr/share/shibboleth/main.css

    <Location /shibboleth>
        AuthType shibboleth
        ShibRequireSession on
        require valid-user
        ShibUseHeaders On
        ShibRequestSetting exportAssertion true
    </Location>

    Alias /static /var/www/html/static
    <Directory "/var/www/html/static">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header set Cache-Control "public"
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Require all granted
        AllowOverride None
        Options None
    </Directory>

    ProxyPass /.well-known/acme-challenge !
    ProxyPass /static !
    ProxyPass /Shibboleth.sso !
    ProxyPass /shibboleth-sp !

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    ProxyPass / http://django-app:8000/
    ProxyPassReverse / http://django-app:8000/

    <Location />
        ShibUseHeaders On
        ShibRequestSetting exportAssertion true
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/aimagelab_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/aimagelab_ssl_access.log combined
</VirtualHost>
</IfModule>
