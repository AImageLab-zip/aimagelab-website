<VirtualHost *:80>
    ServerName aimagelab.unimore.it
    ServerAlias aimagelab-app.ing.unimore.it aimagelab.ing.unimore.it
    ServerAlias imagelab.ing.unimo.it www.imagelab.unimo.it www.imagelab.ing.unimo.it imagelab.unimo.it
    ServerAlias www.aimagelab.unimo.it www.aimagelab.ing.unimo.it aimagelab.unimo.it aimagelab.ing.unimo.it
    DocumentRoot /var/www/html
    
    # Let's Encrypt ACME challenge - serve directly from Apache
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Require all granted
        AllowOverride None
        Options None
    </Directory>
    
    # Redirect HTTP to HTTPS canonical domain (except for ACME challenge)
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://aimagelab.unimore.it%{REQUEST_URI} [END,NE,R=permanent]
    
    ErrorLog ${APACHE_LOG_DIR}/aimagelab_error.log
    CustomLog ${APACHE_LOG_DIR}/aimagelab_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
# Production VirtualHost on port 443
<VirtualHost *:443>
    ServerName aimagelab.unimore.it
    ServerAlias aimagelab-app.ing.unimore.it aimagelab.ing.unimore.it
    ServerAlias imagelab.ing.unimo.it www.imagelab.unimo.it www.imagelab.ing.unimo.it imagelab.unimo.it
    ServerAlias www.aimagelab.unimo.it www.aimagelab.ing.unimo.it aimagelab.unimo.it aimagelab.ing.unimo.it
    ServerAdmin admin@unimore.it
    DocumentRoot /var/www/html
    
    # Redirect /imagelab to legacy server
    RewriteEngine On
    RewriteRule ^/imagelab(.*)$ https://aimagelab-legacy.ing.unimore.it/imagelab$1 [R=301,L]
    
    # Redirect all aliases to canonical domain
    RewriteCond %{HTTP_HOST} !^aimagelab\.unimore\.it$ [NC]
    RewriteRule ^(.*)$ https://aimagelab.unimore.it$1 [R=301,L]
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/aimagelab-app.ing.unimore.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/aimagelab-app.ing.unimore.it/privkey.pem
    
    # Include SSL options (will be created by certbot)
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy same-origin
    Header always set Cross-Origin-Opener-Policy same-origin
    
    # Shibboleth configuration
    <Location /Shibboleth.sso>
        AuthType None
        Require all granted
        SetHandler shib
    </Location>
    
    # Shibboleth SP files
    Alias /shibboleth-sp /usr/share/shibboleth/main.css
    
    # Protected Shibboleth location
    <Location /shibboleth>
        AuthType shibboleth
        ShibRequireSession on
        require valid-user
        
        # Pass Shibboleth attributes as HTTP headers
        ShibUseHeaders On
        ShibRequestSetting exportAssertion true
    </Location>
    
    # Static files - serve directly from Apache
    Alias /static /var/www/html/static
    <Directory "/var/www/html/static">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header set Cache-Control "public"
    </Directory>
    
    # Proxy configuration for Django application
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Let's Encrypt ACME challenge - serve directly from Apache
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Require all granted
        AllowOverride None
        Options None
    </Directory>
    
    # Don't proxy static, Shibboleth files, and ACME challenges
    ProxyPass /.well-known/acme-challenge !
    ProxyPass /static !
    ProxyPass /Shibboleth.sso !
    ProxyPass /shibboleth-sp !
    
    # Pass important headers to Django for CSRF and security
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    
    # Proxy all other requests to Django/Gunicorn (PRODUCTION)
    ProxyPass / http://django-app:8000/
    ProxyPassReverse / http://django-app:8000/
    
    # Pass Shibboleth attributes to Django
    <Location />
        # Ensure Shibboleth attributes are passed through
        ShibUseHeaders On
        ShibRequestSetting exportAssertion true
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/aimagelab_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/aimagelab_ssl_access.log combined
</VirtualHost>

# Development VirtualHost on port 8443
<VirtualHost *:8443>
    ServerName aimagelab-app.ing.unimore.it
    ServerAdmin admin@unimore.it
    DocumentRoot /var/www/html
    
    # SSL Configuration - Use production Let's Encrypt certificates
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/aimagelab-app.ing.unimore.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/aimagelab-app.ing.unimore.it/privkey.pem
    
    # Include SSL options (will be created by certbot)
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy same-origin
    Header always set Cross-Origin-Opener-Policy same-origin
    
    # Shibboleth configuration
    <Location /Shibboleth.sso>
        AuthType None
        Require all granted
        SetHandler shib
    </Location>
    
    # Shibboleth SP files
    Alias /shibboleth-sp /usr/share/shibboleth/main.css
    
    # Protected Shibboleth location
    <Location /shibboleth>
        AuthType shibboleth
        ShibRequireSession on
        require valid-user
        
        # Pass Shibboleth attributes as HTTP headers
        ShibUseHeaders On
        ShibRequestSetting exportAssertion true
    </Location>
    
    # Static files - serve directly from Apache (development static files)
    Alias /static /var/www/html/static-dev
    <Directory "/var/www/html/static-dev">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header set Cache-Control "public"
    </Directory>
    
    # Proxy configuration for Django application
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Don't proxy static and Shibboleth files
    ProxyPass /static !
    ProxyPass /Shibboleth.sso !
    ProxyPass /shibboleth-sp !
    
    # Pass important headers to Django for CSRF and security
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    
    # Proxy all other requests to Django development server (DEVELOPMENT)
    ProxyPass / http://dev-django-app:8000/
    ProxyPassReverse / http://dev-django-app:8000/
    
    # Pass Shibboleth attributes to Django
    <Location />
        # Ensure Shibboleth attributes are passed through
        ShibUseHeaders On
        ShibRequestSetting exportAssertion true
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/aimagelab_dev_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/aimagelab_dev_ssl_access.log combined
</VirtualHost>
</IfModule>
