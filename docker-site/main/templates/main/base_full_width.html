{% extends "main/base.html" %}

{% block content %}
    <!-- Hero Section -->
    <div class="hero bg-base-200">  
        <div class="container px-6 text-base-content py-20 pt-32">
            <div>
                <h1 class="mb-5 text-2xl md:text-5xl font-bold text-primary text-balance">
                    {% block hero_title %}{% endblock %}
                </h1>
                <p class="mb-5 text-balance">
                    {% block hero_description %}{% endblock %}
                </p>
            </div>
        </div>
    </div>

    <!-- Full Width Content -->
    <div class="container mx-auto px-6 my-12">
        {% block page_content %}{% endblock %}
    </div>
{% endblock %}
