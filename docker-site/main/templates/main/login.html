{% extends 'main/base.html' %}

{% block title %}Login - AImageLab{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5 pt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card card-body shadow">
                <div class="text-center mb-4">
                    <h1 class="fs-2 text-primary fw-bold mb-2">Hello World!</h1>
                    <p class="text-muted">Welcome to AImageLab</p>
                </div>
                
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control"
                            required 
                            placeholder="Enter your username"
                            autofocus
                        >
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control"
                            required 
                            placeholder="Enter your password"
                        >
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">Please use your credentials to access the system</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
