{% extends 'main/base.html' %}

{% block title %}Login - AImageLab{% endblock %}

{% block content %}
<!-- Inner Page Hero -->
<section class="inner-page d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="custom-card p-4 shadow">
                    <div class="text-center mb-4">
                        <h1 class="fs-2 title-bordeaux fw-bold mb-2">Hello World!</h1>
                        <p class="title-black">Welcome to AImageLab</p>
                    </div>
                    
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold title-bordeaux">Username</label>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-control rounded-object"
                                required 
                                placeholder="Enter your username"
                                autofocus
                            >
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold title-bordeaux">Password</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-control rounded-object"
                                required 
                                placeholder="Enter your password"
                            >
                        </div>
                        
                        <button type="submit" class="red-btn w-100 fw-bold">Login</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="title-black small">Please use your credentials to access the system</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
