{% extends 'main/base.html' %}

{% block title %}Edit Post - AImageLab{% endblock %}

{% block content %}
<div class="card">
    <h1>Edit Post</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
            <label>Title:</label><br>
            <input type="text" name="title" value="{{ post.title }}" required style="width: 100%; padding: 0.5rem;">
        </div>
        <div style="margin-top: 1rem;">
            <label>Slug:</label><br>
            <input type="text" name="slug" value="{{ post.slug }}" required style="width: 100%; padding: 0.5rem;">
        </div>
        <div style="margin-top: 1rem;">
            <label>Description:</label><br>
            <textarea name="description" rows="3" style="width: 100%; padding: 0.5rem;">{{ post.description }}</textarea>
        </div>
        <div style="margin-top: 1rem;">
            <label>Content:</label><br>
            <textarea name="content" rows="10" required style="width: 100%; padding: 0.5rem;">{{ post.content }}</textarea>
        </div>
        <div style="margin-top: 1rem;">
            <label>Cover Image:</label><br>
            {% if post.cover %}
            <img src="{{ post.cover.url }}" alt="Current cover" style="max-width: 200px; display: block; margin-bottom: 0.5rem;">
            {% endif %}
            <input type="file" name="cover" accept="image/*">
        </div>
        <div style="margin-top: 1rem;">
            <label>
                <input type="checkbox" name="is_published" value="true" {% if post.is_published %}checked{% endif %}>
                Published
            </label>
        </div>
        <div style="margin-top: 1rem;">
            <button type="submit" style="padding: 0.5rem 1rem; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">Update Post</button>
            <a href="{% url 'single' post.slug %}" style="margin-left: 1rem; padding: 0.5rem 1rem; background-color: #95a5a6; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
