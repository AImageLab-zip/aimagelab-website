# Base docker-compose.yml
# This file defines shared resources only (volumes and networks)
# Use docker-compose.prod.yml for production: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# Use docker-compose.dev.yml for development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services: {}

volumes:
  # Production volumes
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  
  # Development volumes
  dev_mysql_data:
  dev_redis_data:
  dev_static_volume:
  
  # Shared volumes
  letsencrypt_data:
  letsencrypt_webroot:

networks:
  prod-network:
    driver: bridge
  dev-network:
    driver: bridge
  shared-network:
    driver: bridge

